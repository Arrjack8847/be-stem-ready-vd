name: Prepare Who Is BSR Proxies

on:
  push:
    paths:
      - ".github/workflows/who-media-proxies.yml"

permissions:
  contents: write

jobs:
  proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create edit-friendly proxies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "public/media/who/_proxy"

          ffmpeg -hide_banner -loglevel error -y             -i "after 15 seconds/20240429_IMG_4384.mp4"             -vf "fps=30,scale=1920:1080:flags=lanczos,format=yuv420p"             -c:v libx264 -preset medium -crf 18             -c:a aac -b:a 160k             "public/media/who/_proxy/20240429_IMG_4384-proxy.mp4"

          ffmpeg -hide_banner -loglevel error -y             -i "after 15 seconds/20240429_IMG_4388.mp4"             -vf "fps=30,scale=1920:1080:flags=lanczos,format=yuv420p"             -c:v libx264 -preset medium -crf 18             -c:a aac -b:a 160k             "public/media/who/_proxy/20240429_IMG_4388-proxy.mp4"

      - name: Commit proxies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/media/who/_proxy"
          git commit -m "Add edit-friendly Who Is BSR proxies [skip ci]" || exit 0
          git push

name: Who Is BSR Media Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/who-is-bsr-media-audit.yml'

permissions:
  contents: read

env:
  SRC_DIR: after 15 seconds
  OUT_DIR: who-is-bsr-audit-dense

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Pull scoped LFS media
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="after 15 seconds/*.mp4"
          mkdir -p "$OUT_DIR"

      - name: Dense samples for short workshop clips
        shell: bash
        run: |
          set -euo pipefail
          for base in "20240429_IMG_4384.mp4" "20240429_IMG_4388.mp4"; do
            stem="${base%.mp4}"
            mkdir -p "$OUT_DIR/dense/$stem"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC_DIR/$base")
            end=$(python3 -c "import math; print(int(math.floor(float('$dur'))))")
            for ((s=0; s<=end; s++)); do
              printf -v label "%03d" "$s"
              ffmpeg -hide_banner -loglevel error -ss "$s" -i "$SRC_DIR/$base" -frames:v 1 -vf "scale='min(960,iw)':-2" -q:v 4 "$OUT_DIR/dense/$stem/${label}s.jpg"
            done
          done

      - name: Dense samples for long reels
        shell: bash
        run: |
          set -euo pipefail
          for spec in "20240430_IMG_4457-compressed.mp4:10" "20240702_ENJOY AI 2024 V2-compressed.mp4:5"; do
            base="${spec%:*}"
            step="${spec##*:}"
            stem="${base%.mp4}"
            mkdir -p "$OUT_DIR/dense/$stem"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC_DIR/$base")
            end=$(python3 -c "import math; print(int(math.floor(float('$dur'))))")
            for ((s=0; s<=end; s+=step)); do
              printf -v label "%03d" "$s"
              ffmpeg -hide_banner -loglevel error -ss "$s" -i "$SRC_DIR/$base" -frames:v 1 -vf "scale='min(960,iw)':-2" -q:v 4 "$OUT_DIR/dense/$stem/${label}s.jpg"
            done
          done

      - name: ENJOY AI scene-change index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/scenes/enjoy-ai"
          ffmpeg -hide_banner -i "$SRC_DIR/20240702_ENJOY AI 2024 V2-compressed.mp4" \
            -vf "select='gt(scene,0.20)',showinfo,scale=960:-2" -fps_mode vfr \
            -q:v 4 "$OUT_DIR/scenes/enjoy-ai/scene_%03d.jpg" \
            2> "$OUT_DIR/scenes/enjoy-ai/showinfo.log" || true
          grep -oE 'pts_time:[0-9.]+' "$OUT_DIR/scenes/enjoy-ai/showinfo.log" | cut -d: -f2 > "$OUT_DIR/scenes/enjoy-ai/timestamps.txt" || true

      - name: Target candidate windows
        shell: bash
        run: |
          set -euo pipefail
          base="20240702_ENJOY AI 2024 V2-compressed.mp4"
          mkdir -p "$OUT_DIR/target/enjoy-ai"
          for range in "20:35" "38:55" "58:78" "80:100" "102:135" "140:160" "185:213"; do
            start="${range%:*}"; end="${range##*:}"
            for ((s=start; s<=end; s+=2)); do
              printf -v label "%03d" "$s"
              ffmpeg -hide_banner -loglevel error -ss "$s" -i "$SRC_DIR/$base" -frames:v 1 -vf "scale='min(1280,iw)':-2" -q:v 3 "$OUT_DIR/target/enjoy-ai/${label}s.jpg"
            done
          done

      - name: Upload dense audit
        uses: actions/upload-artifact@v4
        with:
          name: who-is-bsr-media-audit-dense
          path: who-is-bsr-audit-dense
          if-no-files-found: error
          retention-days: 3

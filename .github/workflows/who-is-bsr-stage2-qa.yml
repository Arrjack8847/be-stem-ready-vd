name: Who Is BSR Stage 2 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/who-is-bsr-stage2-qa.yml'
      - 'src/**'
      - 'scripts/prepare-who-assets.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull scoped LFS media
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="after 15 seconds/*.mp4,public/media/who/_proxy/*.mp4,public/media/hook/**/*.mp4"
          git lfs checkout

      - name: Install dependencies
        run: npm ci

      - name: Prepare Who Is BSR media
        run: npm run prepare:who

      - name: TypeScript check
        run: npm run check

      - name: Render normal section
        run: npx remotion render src/index.ts WhoIsBSR out/qa/who-is-bsr-stage2.mp4 --codec=h264 --crf=20 --concurrency=2

      - name: Render picture-only section
        run: npx remotion render src/index.ts WhoIsBSR-PictureOnly out/qa/who-is-bsr-picture-only.mp4 --codec=h264 --crf=27 --concurrency=2

      - name: Render music-only section
        run: npx remotion render src/index.ts WhoIsBSR-MusicOnly out/qa/who-is-bsr-music-only.mp4 --codec=h264 --crf=27 --concurrency=2

      - name: Render QA stills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa/stills
          for frame in 0 18 80 91 124 151 186 246 331 390 490 550 571 592 620 629; do
            npx remotion still src/index.ts WhoIsBSR "out/qa/stills/who-${frame}.png" --frame="${frame}"
          done
          for frame in 449 450 455; do
            npx remotion still src/index.ts FullFilm "out/qa/stills/full-${frame}.png" --frame="${frame}"
          done

      - name: Create small-preview render
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -i out/qa/who-is-bsr-stage2.mp4 -vf "scale=640:-2" -c:v libx264 -crf 24 -c:a aac -b:a 128k out/qa/who-is-bsr-small-preview.mp4

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: who-is-bsr-stage2-qa
          path: out/qa
          retention-days: 3
          if-no-files-found: error

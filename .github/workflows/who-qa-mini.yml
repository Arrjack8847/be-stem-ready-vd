name: Who Is BSR Mini QA Sheet

on:
  push:
    paths:
      - ".github/workflows/who-qa-mini.yml"

permissions:
  contents: write

jobs:
  mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Build lightweight QA sheet
        run: |
          montage .who-qa/frames/*.jpg \
            -label "%t" -tile "7x3" -geometry "220x135+2+14" \
            -quality 58 -background "#08111e" -fill white -pointsize 9 \
            .who-qa/contact-mini.jpg
          base64 -w 0 .who-qa/contact-mini.jpg > .who-qa/contact-mini.b64
      - name: Commit mini QA sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .who-qa/contact-mini.jpg .who-qa/contact-mini.b64
          git commit -m "Add lightweight Who Is BSR QA sheet [skip ci]" || exit 0
          git push
